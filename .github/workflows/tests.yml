name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --frozen
      - name: Vérifier le catalogue, l’administration et les contacts
        run: uv run pytest -q
