[project]
name = "racket-go"
version = "0.1.0"
description = "Vitrine de raquettes de padel avec catalogue, stock et contacts."
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit==1.65.0",
    "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
